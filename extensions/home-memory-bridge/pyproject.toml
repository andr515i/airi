[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-memory-bridge"
version = "0.1.0"
description = "A local, inspectable continuity layer for AIRI and llama.cpp"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.29,<1",
]

[project.scripts]
home-memory = "home_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["home_bridge*"]
